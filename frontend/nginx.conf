server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
    location ~ \.(mjs|wasm)$ {
        types { text/javascript mjs; application/wasm wasm; }
        try_files $uri =404;
    }
    location /pdfjs/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
