name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-center-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test desktop/tests/Hermes.ControlCenter.Tests/Hermes.ControlCenter.Tests.csproj -c Release

  control-center-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test desktop/tests/Hermes.ControlCenter.Tests/Hermes.ControlCenter.Tests.csproj -c Release
      - run: dotnet publish desktop/src/Hermes.ControlCenter/Hermes.ControlCenter.csproj -c Release -r win-x64 --self-contained true -o .local/control-center-ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Hermes.slnx -c Release
        working-directory: backend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8080/health/ready
      - run: node scripts/smoke-auth.mjs
        env:
          HERMES_SMOKE_ISOLATED: "true"
      - run: node scripts/smoke-document-preview.mjs
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
