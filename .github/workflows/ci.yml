name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  debian-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Debian 13 HTTPS, encrypted backup and full recovery
        env:
          HERMES_CI_TEMP: ${{ runner.temp }}/hermes-debian13
        run: |
          mkdir -p "$HERMES_CI_TEMP"
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$HERMES_CI_TEMP:$HERMES_CI_TEMP" \
            -w "$GITHUB_WORKSPACE" \
            -e HERMES_SMOKE_ISOLATED=true -e HERMES_CI_TEMP \
            debian:13-slim bash -c '
              set -Eeuo pipefail
              bash deploy/debian13/install-debian13.sh --no-start
              apt-get install -y shellcheck nodejs systemd
              git config --global --add safe.directory "$PWD"
              shellcheck deploy/debian13/*.sh deploy/debian13/tests/*.sh deploy/teamcity/*.sh
              for unit in deploy/debian13/systemd/*; do
                sed -e "s|@ROOT@|$PWD|g" -e "s|@CONFIG@|$HERMES_CI_TEMP/config/staging.env|g" "$unit" > "/tmp/$(basename "$unit")"
              done
              systemd-analyze verify /tmp/hermes-*.service /tmp/hermes-*.timer
              bash deploy/debian13/tests/roundtrip.sh
            '

  control-center-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test desktop/tests/Hermes.ControlCenter.Tests/Hermes.ControlCenter.Tests.csproj -c Release

  control-center-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test desktop/tests/Hermes.ControlCenter.Tests/Hermes.ControlCenter.Tests.csproj -c Release
      - run: dotnet publish desktop/src/Hermes.ControlCenter/Hermes.ControlCenter.csproj -c Release -r win-x64 --self-contained true -o .local/control-center-ci

  workstation-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install a separate checkout, start and check the services
        env:
          PROJECT: ${{ runner.temp }}/HERMES workstation
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/hermes-upstream.git"
          git clone --bare . "$repository"
          git --git-dir="$repository" update-ref refs/heads/main "$(git rev-parse HEAD)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.file://$repository.insteadOf"
          export GIT_CONFIG_VALUE_0=https://github.com/NemodaMark/Hermes_flotter.git
          shellcheck scripts/install-workstation.sh
          bash scripts/install-workstation.sh "$PROJECT"
          test -x "$HOME/Desktop/HERMES.desktop"
          cli="$PROJECT/.local/workstation/launcher/Hermes.Workstation.dll"
          trap 'dotnet "$cli" stop "$PROJECT"' EXIT
          dotnet "$cli" start "$PROJECT"
          dotnet "$cli" status "$PROJECT"
      - name: Show workstation logs
        if: failure()
        env:
          PROJECT: ${{ runner.temp }}/HERMES workstation
        run: |
          for log in "$PROJECT"/.local/control-center/logs/*.log; do
            if [[ -f "$log" ]]; then tail -n 80 "$log"; fi
          done

  workstation-debian13:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install and start from the desktop shortcut on Debian 13
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/hermes-debian-upstream.git"
          git clone --bare . "$repository"
          git --git-dir="$repository" update-ref refs/heads/main "$(git rev-parse HEAD)"
          docker run --rm \
            --env "HERMES_TEST_UID=$(id -u)" \
            --volume "$repository:/hermes-upstream.git:ro" \
            --volume "$GITHUB_WORKSPACE/scripts:/hermes-scripts:ro" \
            debian:13-slim bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                sudo dbus-daemon desktop-file-utils libglib2.0-bin xauth xdg-user-dirs \
                xdotool xfonts-base xterm xvfb
              useradd --create-home --shell /bin/bash --uid "$HERMES_TEST_UID" hermes
              printf "hermes ALL=(root) NOPASSWD: ALL\n" > /etc/sudoers.d/hermes
              chmod 0440 /etc/sudoers.d/hermes
              sudo -Hu hermes env \
                GIT_CONFIG_COUNT=1 \
                GIT_CONFIG_KEY_0=url.file:///hermes-upstream.git.insteadOf \
                GIT_CONFIG_VALUE_0=https://github.com/NemodaMark/Hermes_flotter.git \
                bash /hermes-scripts/tests/workstation-debian13.sh
            '

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Hermes.slnx -c Release
        working-directory: backend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8080/health/ready
      - name: Verify account provisioning and company access
        run: |
          export HERMES_INITIAL_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          docker compose run --rm --no-deps -e HERMES_INITIAL_ADMIN_PASSWORD migrate --initialize-system-admin ci.registrar ci.registrar@example.test
          node scripts/smoke-auth.mjs
        env:
          HERMES_SMOKE_ISOLATED: "true"
      - run: node scripts/smoke-document-preview.mjs
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
